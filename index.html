<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <title>DavAI</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Boot loader -->
  <div id="bootLoader" class="boot-loader">
    <div class="boot-mark">DavAI</div>
    <div class="boot-bar"><span></span></div>
  </div>

  <!-- AUTH VIEW -->
  <main id="authView" class="auth-view is-hidden" aria-hidden="true">
    <section class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">DavAI</div>
        <p class="auth-tagline">Your personal AI assistant</p>
      </div>

      <div class="auth-tabs" role="tablist">
        <button class="auth-tab is-active" data-tab="signin" role="tab" aria-selected="true">Sign in</button>
        <button class="auth-tab" data-tab="signup" role="tab" aria-selected="false">Sign up</button>
      </div>

      <form id="authForm" class="auth-form" novalidate>
        <label class="field">
          <span class="field-label">Email</span>
          <input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com" required />
        </label>

        <label class="field">
          <span class="field-label">Password</span>
          <span class="field-password">
            <input id="authPassword" type="password" autocomplete="current-password" placeholder="••••••••" required />
            <button type="button" id="togglePassword" class="field-toggle" aria-label="Show password"></button>
          </span>
        </label>

        <div id="authError" class="auth-error is-hidden" role="alert"></div>

        <button type="submit" id="authSubmit" class="btn btn-primary btn-block">
          <span class="btn-label">Sign in</span>
          <span class="btn-spinner is-hidden" aria-hidden="true"></span>
        </button>
      </form>

      <div class="auth-divider"><span>or continue with</span></div>

      <div class="auth-providers">
        <button type="button" class="btn btn-ghost btn-provider" data-provider="google">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47a5.53 5.53 0 0 1-2.4 3.63v3h3.87c2.26-2.08 3.55-5.14 3.55-8.87z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.94-2.91l-3.87-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09A11.99 11.99 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.27 14.28a7.2 7.2 0 0 1 0-4.56V6.63H1.29a12 12 0 0 0 0 10.74l3.98-3.09z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.43-3.43C17.95 1.19 15.24 0 12 0 7.7 0 3.99 2.47 1.29 6.63l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
          <span>Google</span>
        </button>
        <button type="button" class="btn btn-ghost btn-provider" data-provider="github">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.56-.29-5.26-1.28-5.26-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.24 2.77.12 3.06.74.81 1.18 1.84 1.18 3.1 0 4.43-2.7 5.4-5.28 5.68.41.35.78 1.05.78 2.12v3.14c0 .31.2.68.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
          <span>GitHub</span>
        </button>
      </div>

      <p class="auth-legal">By continuing you agree to the terms of use.</p>
    </section>
  </main>

  <!-- APP VIEW -->
  <div id="appView" class="app-view is-hidden" aria-hidden="true">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="Conversations">
      <header class="sidebar-head">
        <div class="brand-mark sm">DavAI</div>
        <button id="closeSidebar" class="icon-btn sidebar-close" aria-label="Close sidebar"></button>
      </header>

      <button id="newChatBtn" class="btn btn-primary btn-block btn-new-chat">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
        <span>New chat</span>
      </button>

      <div class="sidebar-search">
        <input id="convSearch" type="search" placeholder="Search conversations" />
      </div>

      <nav id="convList" class="conv-list" aria-label="Conversation history"></nav>

      <footer class="sidebar-foot">
        <button id="settingsBtn" class="menu-item" type="button">
          <span>Settings</span>
        </button>
        <button id="signOutBtn" class="menu-item" type="button">
          <span>Sign out</span>
        </button>
      </footer>
    </aside>

    <div id="sidebarScrim" class="sidebar-scrim" hidden></div>

    <!-- Main chat area -->
    <section class="chat">
      <header class="chat-head">
        <button id="openSidebar" class="icon-btn" aria-label="Open sidebar"></button>
        <div class="chat-title">
          <h1 id="chatTitle">New chat</h1>
          <p id="chatSubtitle" class="muted"></p>
        </div>
        <div class="chat-head-actions">
          <button id="themeToggle" class="icon-btn" aria-label="Toggle theme"></button>
          <button id="userMenuBtn" class="icon-btn" aria-label="Account"></button>
        </div>
      </header>

      <div id="messages" class="messages" aria-live="polite"></div>

      <div id="emptyState" class="empty-state">
        <div class="empty-mark">DavAI</div>
        <h2>How can I help you today?</h2>
        <p class="muted">Ask anything. DavAI uses live AI and web search when needed.</p>
      </div>

      <form id="composer" class="composer" autocomplete="off">
        <div class="composer-inner">
          <textarea id="composerInput" rows="1" placeholder="Message DavAI..." aria-label="Message"></textarea>
          <button type="button" id="stopBtn" class="btn btn-ghost is-hidden" aria-label="Stop generating"></button>
          <button type="submit" id="sendBtn" class="btn btn-primary icon-only" aria-label="Send"></button>
        </div>
        <p class="composer-hint muted">Enter to send · Shift + Enter for new line</p>
      </form>
    </section>
  </div>

  <script type="module" src="js/firebase.js"></script>
 <script type="module" src="js/app.js"></script>
  <script type="module" src="js/diag.js"></script>
</body>
</html>
